<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spiral Notebook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="notebook" tabindex="0" role="application" aria-label="Page 1 of 5">
        <div class="cover" aria-hidden="true"></div>
        <div class="left-stack" aria-hidden="true"></div>
        <div class="right-stack" aria-hidden="true"></div>
        <div class="turn-shadow" aria-hidden="true"></div>
        <div class="active-layer" aria-hidden="true"></div>
        <img class="spiral" src="assets/spiral.png" alt="" aria-hidden="true" />
        <p class="page-status" aria-live="polite">Page 1 of 5</p>
        <button class="next-page" type="button">Next page ↓</button>
        <p class="gesture-hint">Scroll or use ← →</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
