<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notebook Story</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="book" aria-label="Notebook story">
      <div class="book__stage">
        <div class="book__shadow" aria-hidden="true"></div>
        <div class="paper" aria-live="polite">
          <img class="paper__image" src="imge%20refrences/Download%20Blank%20open%20notebook%20with%20ring%20binder%20isolated%20on%20white%20ideal%20for%20business%20school%20art%20or%20craft%20scenes%20for%20free.jpg" alt="" aria-hidden="true" />
          <div class="paper__content">
            <p class="eyebrow" id="eyebrow">A small beginning</p>
            <h1 id="title">Ideas start<br />on a blank page.</h1>
            <p id="body">Scroll to turn the page and move through the story.</p>
            <span class="page-number" id="page-number">01 / 04</span>
          </div>
        </div>
      </div>

      <div class="book__scroll" aria-label="Story pages">
        <section class="chapter" data-eyebrow="A small beginning" data-title="Ideas start|on a blank page." data-body="Every good story needs room to become itself." data-page="01 / 04"></section>
        <section class="chapter" data-eyebrow="Chapter one" data-title="Notice the|little things." data-body="A quiet detail can change the way the whole picture feels." data-page="02 / 04"></section>
        <section class="chapter" data-eyebrow="Chapter two" data-title="Make space|for wonder." data-body="Leave a little white space. Let the important parts breathe." data-page="03 / 04"></section>
        <section class="chapter" data-eyebrow="The last page" data-title="Keep going|from here." data-body="The next page is yours to write." data-page="04 / 04"></section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
